version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -fsSL https://bun.sh/install | bash
        # The bun installer may write its PATH entry to ~/.bash_profile or ~/.bashrc,
        # so add it explicitly instead of sourcing a shell rc file.
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun install
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
